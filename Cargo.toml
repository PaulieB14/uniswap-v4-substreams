[package]
name = "uniswap-v4-substreams"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
substreams = "0.8.0"
substreams-ethereum = "0.12.0"
ethabi = "18"
substreams-database-change = "5.0.0"
buffa = "0.9.2"
buffa-types = "0.9.2"
hex-literal = "0.4"

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[dev-dependencies]
tiny-keccak = { version = "2", features = ["keccak"] }

[build-dependencies]
anyhow = "1"
substreams-ethereum = "0.12.0"

[profile.release]
lto = true
opt-level = 's'
strip = "debuginfo"
