syntax = "proto3";
package uniswap.v4.v1;

// Block/tx/log provenance carried on every event row. The subgraph splits this
// across a Transaction entity + @derivedFrom back-references; flattening it
// makes every row independently queryable without a join.
message Meta {
  uint64 block_number   = 1;
  uint64 block_timestamp= 2;
  string tx_hash        = 3;
  uint32 log_index      = 4;
  string origin         = 5;  // tx.from — the EOA, as the subgraph's `origin`
  uint64 gas_used       = 6;
  string gas_price      = 7;
}

// A hook's declared capabilities, decoded from the LOW 14 BITS OF ITS ADDRESS.
// Uniswap V4 mines hook addresses so the permission set is encoded in the
// address itself — so this is free, needs no RPC, and is known at pool creation
// even for a hook nobody has ever seen before. The source subgraph stores
// `hooks` as an opaque address string and cannot answer "which pools can
// override swap fees".
message HookPermissions {
  string address                              = 1;
  bool   before_initialize                    = 2;   // bit 13
  bool   after_initialize                     = 3;   // bit 12
  bool   before_add_liquidity                 = 4;   // bit 11
  bool   after_add_liquidity                  = 5;   // bit 10
  bool   before_remove_liquidity              = 6;   // bit 9
  bool   after_remove_liquidity               = 7;   // bit 8
  bool   before_swap                          = 8;   // bit 7
  bool   after_swap                           = 9;   // bit 6
  bool   before_donate                        = 10;  // bit 5
  bool   after_donate                         = 11;  // bit 4
  bool   before_swap_returns_delta            = 12;  // bit 3
  bool   after_swap_returns_delta             = 13;  // bit 2
  bool   after_add_liquidity_returns_delta    = 14;  // bit 1
  bool   after_remove_liquidity_returns_delta = 15;  // bit 0
  uint32 flags                                = 16;  // raw low-14-bit mask
  bool   has_hook                             = 17;  // address != 0
}

message Pool {
  string id            = 1;   // PoolId (bytes32) — V4 pools are ids, not addresses
  string token0        = 2;
  string token1        = 3;
  uint64 fee_tier      = 4;
  int32  tick_spacing  = 5;
  HookPermissions hook = 6;
  string sqrt_price    = 7;
  int32  tick          = 8;
  string liquidity     = 9;
  // Dynamic-fee pools set fee to 0x800000. Precomputing this beats making every
  // consumer know the sentinel.
  bool   is_dynamic_fee = 10;
  Meta   meta           = 11;
  // Token metadata, joined from store_tokens. Present only once the token has
  // been seen at a pool initialisation; empty otherwise rather than guessed.
  // `decimals_measured` is the honesty flag: an unreadable decimals() falls back
  // to 18, and money maths must not trust that silently.
  string token0_symbol   = 12;
  string token1_symbol   = 13;
  uint32 token0_decimals = 14;
  uint32 token1_decimals = 15;
  bool   decimals_measured = 16;

}

message Swap {
  string id           = 1;
  string pool_id      = 2;
  string sender       = 3;
  string amount0      = 4;   // signed, token units
  string amount1      = 5;
  string sqrt_price_x96= 6;
  string liquidity    = 7;
  int32  tick         = 8;
  uint32 fee          = 9;   // the fee ACTUALLY charged — a hook may override it
  Meta   meta         = 10;

  // ---- denormalised pool identity (fields 11-15) ----------------------------
  // A V4 Swap log carries ONLY the poolId. The tokens, the configured fee, the
  // tick spacing and the hook all live in the PoolKey, which is hashed away at
  // initialize time and never re-emitted. A consumer streaming from a recent
  // block therefore cannot tell what a swap traded without backfilling to that
  // pool's Initialize event — possibly millions of blocks earlier. The subgraph
  // hides this behind its entity store (`Pool.load(poolId)`); Substreams has no
  // implicit store, so the join has to be explicit (store_pools) and the result
  // has to be carried on the row.
  //
  // These are EMPTY on the raw `map_events` output — that module sees one block
  // and cannot know about a pool initialised before it. They are filled by the
  // enriching module that reads `store_pools`. An empty `token0` means "pool not
  // in the store yet", i.e. initialised before this package's initialBlock, NOT
  // "the pool has no token0".
  string token0       = 11;
  string token1       = 12;
  // The pool's CONFIGURED fee from the PoolKey — deliberately a different field
  // from `fee` above, which is the fee this particular swap actually paid. On a
  // dynamic-fee pool the two differ on every row, and collapsing them is exactly
  // the bug in the source subgraph (`pool.feeTier = event.params.fee`).
  uint64 fee_tier     = 13;
  int32  tick_spacing = 14;
  HookPermissions hook = 15;
  // Token metadata, joined from store_tokens. Present only once the token has
  // been seen at a pool initialisation; empty otherwise rather than guessed.
  // `decimals_measured` is the honesty flag: an unreadable decimals() falls back
  // to 18, and money maths must not trust that silently.
  string token0_symbol   = 16;
  string token1_symbol   = 17;
  uint32 token0_decimals = 18;
  uint32 token1_decimals = 19;
  bool   decimals_measured = 20;

  // ---- fields 21-28: HUMAN UNITS and USD -----------------------------------
  //
  // SIGN CONVENTION. `amount0`/`amount1` above are the raw int128s the
  // PoolManager emits, and those are SWAPPER-CENTRIC: negative means the
  // swapper paid that token in, positive means the swapper received it out.
  // The `*_adjusted` fields below are POOL-CENTRIC and therefore carry the
  // OPPOSITE sign, matching the subgraph, which does
  // `convertTokenToDecimal(event.params.amount0.neg(), token0.decimals)`:
  //
  //     amountN_adjusted = -amountN / 10^tokenN_decimals
  //
  // so a positive `amount0_adjusted` means the POOL RECEIVED token0. Both
  // spellings are kept because they answer different questions and neither is
  // recoverable from the other without the decimals: the raw integer is exact
  // and is what the chain said, the adjusted value is what a human or a price
  // feed wants. Do not delete the raw pair to "save space" — a NUMERIC that has
  // been divided is no longer the on-chain value.
  //
  // Written ONLY when `amounts_adjusted` is true, i.e. when BOTH legs' decimals
  // were actually read over RPC (`decimals_measured`). Scaling by a defaulted 18
  // is wrong by a power of ten on every USDC row, and a plausible wrong number
  // is worse than an absent one. When false these are the empty string and the
  // sink writes 0 — read the flag, not the value.
  string amount0_adjusted = 21;
  string amount1_adjusted = 22;
  bool   amounts_adjusted = 23;

  // USD valuation, from `store_prices` (the port of the subgraph's
  // Bundle.ethPriceUSD / Token.derivedETH). Per-leg values are SIGNED and carry
  // the same pool-centric sign as `*_adjusted`.
  //
  // The price used is the one standing IMMEDIATELY BEFORE this log, not after
  // it — a trade is valued at the price it hit, not the price it created. That
  // is also what the deployed subgraph does, verifiably: it updates
  // `bundle.ethPriceUSD` from the anchor pool after computing `amountUSD`.
  string amount0_usd = 24;
  string amount1_usd = 25;
  // Non-negative TRACKED notional, the analogue of the subgraph's `amountUSD`:
  // the mean of the two absolute leg values when both legs are priced, else the
  // single priced leg's absolute value. Mean rather than sum because the two
  // legs are the two sides of ONE trade; summing double-counts it.
  string amount_usd = 26;
  // The native (ETH) price in USD that the three fields above were computed
  // with, carried per row so a USD figure is auditable without re-deriving the
  // bundle. A `set` store serves the last known price indefinitely, so this is
  // also the only handle on staleness.
  string native_price_usd = 27;
  // True iff `amount_usd` was computable. Distinguishes "this trade was worth
  // $0.00" from "this trade could not be priced" — a zero is otherwise
  // indistinguishable and launders straight into every downstream total.
  bool   priced = 28;
  // Per-leg anchoring flags. `priced` is row-level and says the SWAP got a
  // tracked notional; these say whether each LEG was individually valued.
  // Without them a 0 in amount0_usd is ambiguous: it means either "this leg
  // could not be anchored" or "this leg really was worth nothing", and both
  // occur — testing found a genuine $0 swap (USDC/BaseJak, all amount words
  // zero on chain) sitting alongside 1,101 rows whose leg was simply
  // unanchored. Filter on these, not on amount0_usd <> 0.
  bool   amount0_priced = 29;
  bool   amount1_priced = 30;
}

message ModifyLiquidity {
  string id          = 1;
  string pool_id     = 2;
  string sender      = 3;
  int32  tick_lower  = 4;
  int32  tick_upper  = 5;
  string liquidity_delta = 6;   // signed: add vs remove
  string salt        = 7;
  Meta   meta        = 8;

  // ---- denormalised pool identity (fields 9-13) -----------------------------
  // Same rationale as Swap: the ModifyLiquidity log carries only the poolId, so
  // "which token pair did this LP add to" is unanswerable from the row alone.
  // Filled from `store_pools` by the enriching module; empty on raw map_events.
  string token0      = 9;
  string token1      = 10;
  uint64 fee_tier    = 11;
  int32  tick_spacing = 12;
  HookPermissions hook = 13;
  // Token metadata, joined from store_tokens. Present only once the token has
  // been seen at a pool initialisation; empty otherwise rather than guessed.
  // `decimals_measured` is the honesty flag: an unreadable decimals() falls back
  // to 18, and money maths must not trust that silently.
  string token0_symbol   = 14;
  string token1_symbol   = 15;
  uint32 token0_decimals = 16;
  uint32 token1_decimals = 17;
  bool   decimals_measured = 18;

  // NOTE the deliberate absence of a `liquidity_delta_adjusted`. Unlike a swap
  // amount, `liquidity_delta` is NOT in token units — it is in units of L
  // (sqrt(x*y)), the pool's virtual liquidity. Dividing it by token0's or
  // token1's decimals would produce a number with no unit at all. Converting a
  // liquidity delta into the token amounts it represents needs the position's
  // tick range against the pool's current tick (the `liquidityMath/` tick-math
  // port), which this package does not carry; see README "Known gaps".
}

message PositionEvent {
  string id        = 1;
  string token_id  = 2;
  string kind      = 3;   // subscribe | unsubscribe | transfer
  string address   = 4;   // subscriber, or "to" for a transfer
  string from      = 5;
  string to        = 6;
  Meta   meta      = 7;
}

message HookDeployment {
  string id       = 1;
  string hook     = 2;
  string module   = 3;
  string salt     = 4;
  string factory  = 5;   // which factory minted it — Arrakis today, extensible
  HookPermissions permissions = 6;
  Meta   meta     = 7;
}

// Running per-pool aggregates, carried forward across blocks by the stats store.
//
// This is the "what has this pool actually done" row that the subgraph answers
// with `Pool.txCount` / `volumeToken0`. Emitted only for pools TOUCHED in the
// current block — a full snapshot of every pool on every block would be O(pools)
// output per block for no new information.
message PoolStats {
  string pool_id  = 1;
  // Denormalised from the pool so the stats row is self-describing: a consumer
  // ranking pools by volume should not need a second lookup to name them.
  string token0   = 2;
  string token1   = 3;
  uint64 swap_count = 4;
  // ABSOLUTE-value sums, as decimal BigInt strings in RAW token units.
  //
  // Absolute because V4 swap amounts are signed and swapper-centric (one leg
  // negative, one positive): a plain sum of `amount0` over a two-sided market
  // trends to zero and measures net flow, not volume. `abs` is the standard
  // volume convention and is the only one recoverable here — netting can be
  // derived from the raw swap rows, but volume cannot be recovered from a net.
  //
  // Raw units, NOT decimal-adjusted: token decimals need a per-token RPC lookup
  // that this package deliberately does not pay for (see README "Known gaps").
  // String, not uint64, because a uint256 volume overflows 64 bits routinely.
  string volume_token0_abs = 5;
  string volume_token1_abs = 6;
  uint64 modify_liquidity_count = 7;
  HookPermissions hook = 8;
  // Block of the most recent event folded into these counters. Lets a sink
  // detect staleness and lets an upsert be idempotent on replay.
  uint64 last_block = 9;

  // ---- fields 10-12, additive ----------------------------------------------
  // The same two volumes in HUMAN UNITS: volume_tokenN_abs / 10^decimals(tokenN).
  // No sign question arises — these are already absolute-value sums.
  // Written only when both legs' decimals were RPC-measured; read
  // `volumes_adjusted`, not the value, to tell "zero volume" from "no decimals".
  string volume_token0_adjusted = 10;
  string volume_token1_adjusted = 11;
  bool   volumes_adjusted = 12;
}

// Running per-HOOK aggregates — the roll-up the source subgraph cannot produce
// at all, because it stores `hooks` as an opaque string and has no hook entity.
//
// One hook contract typically serves many pools, so this is the level at which
// "is this hook extracting fees / how much flow does it control" is answerable.
message HookStats {
  string hook_address = 1;
  HookPermissions permissions = 2;
  uint64 pool_count = 3;
  uint64 swap_count = 4;
  string volume_token0_abs = 5;
  string volume_token1_abs = 6;
  // How many DISTINCT effective `Swap.fee` values this hook has charged. A
  // static-fee hook converges to 1; a hook actively repricing per swap does not.
  // Cheap, and it is the single clearest signal that a hook is doing real
  // dynamic-fee work rather than just holding the permission bit.
  uint64 distinct_fee_values = 7;
  uint64 last_block = 8;
}

// PoolManager `Donate(id, sender, amount0, amount1)` — a direct fee donation to
// in-range LPs.
//
// Its own message rather than a row in `swaps`: pb::Swap has no kind
// discriminator, so every donation would be counted as swap volume by any
// consumer of `Events.swaps`. Zeroing sqrt_price_x96 as a sentinel is not viable
// either — legitimate swap rows already carry a zero sqrtPriceX96 for
// aggregator-hook pools, so the sentinel is taken.
message Donate {
  string id       = 1;   // <txHash>-<logIndex>
  string pool_id  = 2;
  string sender   = 3;
  string amount0  = 4;   // uint256, raw token units
  string amount1  = 5;
  Meta   meta     = 6;

  // ---- fields 7-11, additive ----------------------------------------------
  // Denormalised pool identity, same rationale and same source as on Swap: the
  // Donate log carries only the poolId, so "what was donated" is unanswerable
  // from the raw row. Filled by map_enriched from store_pools; empty means
  // "pool not in the store".
  string token0 = 7;
  string token1 = 8;

  // Human units. NOTE the sign convention differs from Swap and that is
  // correct, not an oversight: `Donate.amount0/1` are UNSIGNED uint256 and a
  // donation only ever flows INTO the pool, so the raw value is ALREADY
  // pool-centric. These are therefore scaled but NOT negated:
  //
  //     amountN_adjusted = +amountN / 10^decimals(tokenN)
  //
  // Written only when both legs' decimals were RPC-measured, exactly as on Swap.
  string amount0_adjusted = 9;
  string amount1_adjusted = 10;
  bool   amounts_adjusted = 11;
}

// ERC-6909 claim-token activity on the singleton: `Transfer(caller, from, to,
// id, amount)`, `Approval(owner, spender, id, amount)`, `OperatorSet(owner,
// operator, approved)`.
//
// This is V4's flash-accounting rail — how routers and searchers park value
// INSIDE the PoolManager between swaps instead of settling to ERC-20. Nothing in
// the V4 subgraph surfaces it, and it is the cleanest available signal for "who
// is running multi-hop/atomic strategies on V4".
//
// One message with a `kind` discriminator rather than three, because the three
// events share a subject (a currency balance held by the singleton) and every
// consumer wants them on one timeline. pb::PositionEvent is the wrong home twice
// over: its `token_id` means a PositionManager ERC-721 tokenId whereas the
// ERC-6909 `id` is a CURRENCY id (uint256 of the currency address), and it has
// nowhere at all to put `amount`.
//
// Fields not carried by a given `kind` are left at proto3 default (empty
// string / false). Union-with-discriminator, not per-kind messages: three
// near-identical messages would force every sink to fan out three tables for
// one logical stream.
message ClaimTokenEvent {
  string id          = 1;   // <txHash>-<logIndex>
  string kind        = 2;   // transfer | approval | operator_set
  string caller      = 3;   // transfer: msg.sender (may differ from `from`)
  string owner       = 4;   // approval / operator_set
  string from        = 5;   // transfer
  string to          = 6;   // transfer
  string spender     = 7;   // approval
  string operator    = 8;   // operator_set
  // uint256 currency id = the currency's address widened to uint256. Kept as a
  // decimal string rather than re-narrowed to an address, because that mapping
  // is only valid by convention and a lossy rewrite would be unrecoverable.
  string currency_id = 9;
  string amount      = 10;  // uint256, transfer / approval
  bool   approved    = 11;  // operator_set
  Meta   meta        = 12;
}

// Governance-level fee config: `ProtocolFeeUpdated(id, protocolFee)` and
// `ProtocolFeeControllerUpdated(protocolFeeController)`.
//
// The only on-chain record of protocol revenue being switched on for a pool.
// A partial pb::Pool row is not an option: a sink upserting on `Pool.id` cannot
// distinguish it from a pool creation and would zero out token0/token1/hook.
message ProtocolFeeEvent {
  string id       = 1;   // <txHash>-<logIndex>
  string kind     = 2;   // fee_updated | controller_updated
  string pool_id  = 3;   // fee_updated only — controller updates are global
  // uint24, packed: low 12 bits = fee on 0->1, high 12 bits = fee on 1->0.
  // Left packed because the split is a v4-core encoding detail that may change;
  // the raw value is always recoverable.
  uint32 protocol_fee = 4;
  string controller = 5; // controller_updated only
  Meta   meta     = 6;
}

// ---------------------------------------------------------------------------
// LIFETIME totals. The running-total counterpart to PoolStats / HookStats.
//
// PoolStats/HookStats are per-block DELTAS and stay that way: they are produced
// by a stateless `map` that parallel backfill re-executes out of order, so it
// physically cannot hold a carry. These two messages are produced by a map that
// READS an add-policy store, so every number below is the entity's total from
// the PoolManager deploy block through the end of the block being processed.
//
// Emitted only for entities TOUCHED in the current block. A full snapshot of
// every pool on every block would be O(pools) output per block restating
// numbers that did not change.
//
// The SQL side must write these with a plain `SET column = EXCLUDED.column`
// (an idempotent overwrite of an already-final number) and must NEVER do
// `SET column = column + n` — see the module doc in src/stats_store.rs for why
// the store accumulation is replay-safe and the database accumulation is not.
// ---------------------------------------------------------------------------

// Every numeric field here is a DECIMAL STRING, including the counts.
//
// They are read verbatim out of a `bigint` store, and volumes are uint256 sums
// that overflow 64 bits routinely. Narrowing just the counts to uint64 would
// add a lossy conversion for no gain — a Postgres NUMERIC column takes the
// string either way — and would invite a consumer to treat a volume as a
// count-sized integer. One type across the message removes that footgun.
message PoolTotals {
  string pool_id = 1;
  // Denormalised so the totals row is self-describing, same rationale as
  // PoolStats. Empty when the pool is absent from store_pools (stream started
  // after its Initialize) — empty means "unknown", never "no token0".
  string token0  = 2;
  string token1  = 3;

  string swap_count             = 4;
  string modify_liquidity_count = 5;
  // ABSOLUTE-value sums in RAW token units, same convention as PoolStats:
  // V4 amounts are signed and swapper-centric, so a plain sum measures net flow
  // and trends to zero on a two-sided market. Netting stays derivable from the
  // raw swap rows; volume cannot be recovered from a net.
  string volume_token0_abs      = 6;
  string volume_token1_abs      = 7;

  HookPermissions hook = 8;
  // The block these totals are current AS OF. This is what makes the sink-side
  // upsert safe under out-of-order delivery: guard the write with
  // `WHERE excluded.last_block >= pool_totals.last_block` and a late-arriving
  // older snapshot cannot walk the row backwards.
  uint64 last_block = 9;

  // ---- fields 10-12, additive ----------------------------------------------
  // Lifetime volumes in HUMAN UNITS. Filled by `map_final`, not by `map_totals`:
  // the add-policy store holds raw integers (it must — a bigint store cannot
  // hold a fraction, and rounding each block's delta before summing would drift),
  // and the decimals live on the block's enriched swap/liquidity rows. So the
  // scaling happens in the last stage, once, on the finished total.
  //
  // A pool appears in `pool_totals` only when the block touched it, and every
  // way of touching it (swap / modify_liquidity / initialize) produces an
  // enriched row carrying its decimals — so coverage here is the same as
  // coverage of `volume_token0_abs`, minus the pools whose decimals are
  // unmeasured.
  string volume_token0_adjusted = 10;
  string volume_token1_adjusted = 11;
  bool   volumes_adjusted = 12;
}

message HookTotals {
  string hook_address = 1;
  HookPermissions permissions = 2;

  // Lifetime count of DISTINCT pools deployed under this hook.
  //
  // Addable — and it is worth being explicit about why, because summing a
  // cardinality is normally wrong. This one is fed exclusively by `Initialize`
  // logs, and V4's `initialize` reverts on an already-initialised pool, so a
  // given poolId can emit exactly one Initialize for the life of the chain.
  // Counting those logs IS counting distinct pools. That is an invariant of
  // v4-core, not a property of addition; if the feed ever changes to anything
  // that can repeat per pool, this field becomes a double-count.
  string pool_count = 3;
  string swap_count = 4;
  string modify_liquidity_count = 5;
  string volume_token0_abs = 6;
  string volume_token1_abs = 7;
  uint64 last_block = 8;

  // NOTE the deliberate absence of `distinct_fee_values`, which HookStats has.
  // It is a set cardinality with no on-chain uniqueness invariant behind it: a
  // hook charging 19900 in a thousand blocks contributes 1 to each block's
  // HookStats, and adding those gives 1000, not 1. An add store is the wrong
  // structure for it; a lifetime distinct-fee count needs the fee VALUES
  // retained (a set-policy store keyed `hook:<addr>:fee:<value>`, counted by
  // prefix), which is a different module and is not built here. Do not
  // reintroduce it as a sum.
}

message Events {
  repeated Pool            pools             = 1;
  repeated Swap            swaps             = 2;
  repeated ModifyLiquidity modify_liquidity  = 3;
  repeated PositionEvent   position_events   = 4;
  repeated HookDeployment  hook_deployments  = 5;

  // ---- fields 6-10, additive ------------------------------------------------
  // Aggregates for pools/hooks touched in this block only (see PoolStats).
  repeated PoolStats        pool_stats          = 6;
  repeated HookStats        hook_stats          = 7;
  // Previously-unhomed PoolManager events. They were held out of the proto
  // rather than forced into Swap or PositionEvent, where every candidate shape
  // either lost a field outright or made the row indistinguishable from a real
  // swap/position to a downstream aggregator.
  repeated Donate           donates             = 8;
  repeated ClaimTokenEvent  claim_token_events  = 9;
  repeated ProtocolFeeEvent protocol_fee_events = 10;

  // ---- fields 11-12, additive ----------------------------------------------
  // LIFETIME totals for the entities touched in this block, read back out of
  // the add-policy stats stores. Filled ONLY by `map_totals`; every other
  // module leaves them empty, which is why they are additive fields on the
  // existing Events rather than a new message type — `map_totals` is a
  // pass-through stage over `map_enriched`, so one Events shape flows end to
  // end and `db_out` can be repointed at it with a one-line manifest change.
  repeated PoolTotals       pool_totals         = 11;
  repeated HookTotals       hook_totals         = 12;
}
